<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuition Master</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #0F6E56;
    --bg: #F7FAF9; --white: #ffffff; --text: #1a1a1a; --text-muted: #6b7280;
    --border: #e5e7eb; --card: #ffffff; --danger: #ef4444; --warn: #f59e0b;
    --blue: #3b82f6; --radius: 14px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Plus Jakarta Sans','Noto Sans Bengali',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  #loading-screen { position: fixed; inset: 0; background: var(--green); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; }
  #loading-screen .logo { font-size: 60px; margin-bottom: 16px; }
  #loading-screen h1 { color: #fff; font-size: 24px; font-weight: 700; }
  #loading-screen p { color: rgba(255,255,255,0.7); font-size: 14px; margin-top: 8px; }

  #auth-screen { min-height: 100vh; display: none; align-items: center; justify-content: center; background: linear-gradient(135deg, #0F6E56, #1D9E75, #5DCAA5); padding: 20px; }
  .auth-card { background: var(--white); border-radius: 24px; padding: 36px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .auth-logo { text-align: center; margin-bottom: 28px; }
  .auth-logo .icon { width: 64px; height: 64px; background: var(--green-light); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 28px; }
  .auth-logo h1 { font-size: 24px; font-weight: 700; }
  .auth-logo p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .tabs { display: flex; background: var(--bg); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 24px; }
  .tabs button { flex: 1; padding: 8px; border: none; background: transparent; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text-muted); transition: all 0.2s; font-family: inherit; }
  .tabs button.active { background: var(--white); color: var(--green-dark); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
  .form-group input, .form-group select { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; color: var(--text); background: var(--white); outline: none; transition: border-color 0.2s; }
  .form-group input:focus, .form-group select:focus { border-color: var(--green); }
  .role-btns { display: flex; gap: 8px; margin-bottom: 16px; }
  .role-btn { flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; background: var(--white); color: var(--text-muted); transition: all 0.2s; text-align: center; }
  .role-btn.active { border-color: var(--green); background: var(--green-light); color: var(--green-dark); }
  .btn-primary { width: 100%; padding: 13px; background: var(--green); color: var(--white); border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.2s; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 14px; }
  .hint span { color: var(--green); cursor: pointer; font-weight: 500; }
  .err-msg { background: #FEF2F2; border: 1px solid #FECACA; color: #991B1B; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 12px; display: none; }

  #app { display: none; }
  .topbar { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 16px; height: 58px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
  .topbar .logo { font-size: 16px; font-weight: 700; color: var(--green-dark); flex: 1; }
  .t-avatar { width: 34px; height: 34px; border-radius: 50%; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .role-tag { font-size: 11px; background: var(--green-light); color: var(--green-dark); padding: 3px 8px; border-radius: 20px; font-weight: 500; }
  .logout-btn { padding: 6px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; background: var(--white); color: var(--text-muted); cursor: pointer; font-family: inherit; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 1px solid var(--border); display: flex; z-index: 100; }
  .bottom-nav button { flex: 1; padding: 10px 4px 14px; border: none; background: transparent; cursor: pointer; font-size: 10px; color: var(--text-muted); font-family: inherit; font-weight: 500; transition: color 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bottom-nav button.active { color: var(--green); }
  .nav-icon { font-size: 20px; }

  .main { padding: 16px 16px 80px; max-width: 480px; margin: 0 auto; }
  .page { display: none; }
  .page.active { display: block; }

  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; margin-bottom: 12px; }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-box { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
  .stat-box .num { font-size: 24px; font-weight: 700; color: var(--green); }
  .stat-box .lbl { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

  .teacher-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .tc-header { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
  .tc-avatar { width: 50px; height: 50px; border-radius: 14px; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tc-name { font-size: 15px; font-weight: 600; }
  .tc-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .tc-info { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .tc-info-item .lbl { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
  .tc-info-item .val { font-size: 12px; font-weight: 600; }
  .btn-sm { padding: 9px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-green { background: var(--green); color: var(--white); }
  .btn-outline { background: var(--white); color: var(--green); border: 1.5px solid var(--green); }
  .btn-row { display: flex; gap: 8px; }

  .search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-bar input { flex: 1; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; outline: none; }
  .search-bar input:focus { border-color: var(--green); }
  .filter-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
  .filter-pills::-webkit-scrollbar { display: none; }
  .pill { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; background: var(--white); color: var(--text-muted); transition: all 0.2s; }
  .pill.active { background: var(--green); color: var(--white); border-color: var(--green); }

  .chat-list-item { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; }
  .chat-list-item .msg-preview { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .chat-screen { display: none; flex-direction: column; height: calc(100vh - 58px); position: fixed; top: 58px; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 50; }
  .chat-screen.open { display: flex; }
  .chat-header { padding: 12px 16px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .chat-header button { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--text-muted); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 13px; line-height: 1.5; word-break: break-word; }
  .bubble.them { background: var(--white); border: 1px solid var(--border); border-bottom-left-radius: 4px; align-self: flex-start; }
  .bubble.me { background: var(--green); color: var(--white); border-bottom-right-radius: 4px; align-self: flex-end; }
  .btime { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .btime.r { text-align: right; }
  .chat-input-bar { padding: 12px 16px; background: var(--white); border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .chat-input-bar input { flex: 1; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 13px; font-family: inherit; outline: none; }
  .chat-input-bar input:focus { border-color: var(--green); }
  .send-btn { width: 40px; height: 40px; background: var(--green); border: none; border-radius: 50%; cursor: pointer; color: white; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .profile-header { text-align: center; padding: 24px 16px 16px; }
  .profile-avatar { width: 80px; height: 80px; border-radius: 24px; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  .info-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .key { color: var(--text-muted); }
  .info-row .val { font-weight: 600; }
  .status-badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .status-badge.active { background: var(--green-light); color: var(--green-dark); }
  .status-badge.pending { background: #FEF3C7; color: #92400e; }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .admin-table th { background: var(--bg); padding: 10px 12px; text-align: left; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  .admin-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); }

  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: white; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 500; display: none; z-index: 9999; white-space: nowrap; }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="logo">📚</div>
  <h1>Tuition Master</h1>
  <p>লোড হচ্ছে...</p>
</div>

<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">📚</div>
      <h1>Tuition Master</h1>
      <p>শিক্ষক ও শিক্ষার্থীর সেতুবন্ধন</p>
    </div>
    <div class="tabs">
      <button class="active" onclick="switchTab('login')">লগইন</button>
      <button onclick="switchTab('register')">নিবন্ধন</button>
    </div>
    <div id="auth-err" class="err-msg"></div>

    <div id="login-form">
      <div class="form-group"><label>ইমেইল</label><input type="email" id="l-email" placeholder="আপনার ইমেইল"></div>
      <div class="form-group"><label>পাসওয়ার্ড</label><input type="password" id="l-pass" placeholder="পাসওয়ার্ড"></div>
      <button class="btn-primary" id="login-btn" onclick="doLogin()">লগইন করুন</button>
      <p class="hint">অ্যাকাউন্ট নেই? <span onclick="switchTab('register')">নিবন্ধন করুন</span></p>
    </div>

    <div id="register-form" style="display:none">
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:13px;font-weight:500;color:var(--text-muted);margin-bottom:8px">আমি একজন —</label>
        <div class="role-btns">
          <div class="role-btn active" id="role-s" onclick="selRole('student')">🎓 শিক্ষার্থী</div>
          <div class="role-btn" id="role-t" onclick="selRole('teacher')">👨‍🏫 শিক্ষক</div>
        </div>
      </div>
      <div class="form-group"><label>পুরো নাম</label><input type="text" id="r-name" placeholder="আপনার নাম"></div>
      <div class="form-group"><label>ইমেইল</label><input type="email" id="r-email" placeholder="ইমেইল"></div>
      <div class="form-group"><label>মোবাইল</label><input type="text" id="r-phone" placeholder="+880"></div>
      <div class="form-group"><label>এলাকা</label>
        <select id="r-area">
          <option value="">এলাকা বেছে নিন</option>
          <option>মিরপুর, ঢাকা</option><option>উত্তরা, ঢাকা</option>
          <option>ধানমন্ডি, ঢাকা</option><option>গুলশান, ঢাকা</option>
          <option>মোহাম্মদপুর, ঢাকা</option><option>রামপুরা, ঢাকা</option>
          <option>বাড্ডা, ঢাকা</option><option>চট্টগ্রাম সদর</option><option>সিলেট সদর</option>
        </select>
      </div>
      <div id="t-fields" style="display:none">
        <div class="form-group"><label>বিষয়</label>
          <select id="r-subject">
            <option value="">বিষয় বেছে নিন</option>
            <option>গণিত (Math)</option><option>পদার্থবিজ্ঞান (Physics)</option>
            <option>রসায়ন (Chemistry)</option><option>জীববিজ্ঞান (Biology)</option>
            <option>ইংরেজি (English)</option><option>বাংলা</option><option>ICT</option>
          </select>
        </div>
        <div class="form-group"><label>মাসিক ফি (৳)</label><input type="number" id="r-fee" placeholder="যেমন: 2000"></div>
        <div class="form-group"><label>শ্রেণি</label>
          <select id="r-class">
            <option>Class 1-5</option><option>Class 6-8</option>
            <option>Class 9-10 (SSC)</option><option>Class 11-12 (HSC)</option>
            <option>University</option><option>সব শ্রেণি</option>
          </select>
        </div>
      </div>
      <div id="s-fields">
        <div class="form-group"><label>আপনার শ্রেণি</label>
          <select id="r-grade">
            <option>Class 6</option><option>Class 7</option><option>Class 8</option>
            <option>Class 9</option><option>Class 10</option><option>Class 11</option>
            <option>Class 12</option><option>University</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>পাসওয়ার্ড</label><input type="password" id="r-pass" placeholder="কমপক্ষে ৬ অক্ষর"></div>
      <button class="btn-primary" id="reg-btn" onclick="doRegister()">অ্যাকাউন্ট তৈরি করুন</button>
      <p class="hint">ইতিমধ্যে আছে? <span onclick="switchTab('login')">লগইন করুন</span></p>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="logo">📚 Tuition Master</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="t-avatar" id="top-av"></div>
      <div>
        <div style="font-size:13px;font-weight:500" id="top-name"></div>
        <div class="role-tag" id="top-role"></div>
      </div>
    </div>
    <button class="logout-btn" onclick="doLogout()">বের হন</button>
  </div>

  <div class="main" id="main-content">
    <div class="page active" id="page-home"></div>
    <div class="page" id="page-search">
      <div class="section-title">শিক্ষক খুঁজুন</div>
      <div class="search-bar"><input type="text" id="search-inp" placeholder="নাম বা বিষয়..." oninput="renderTeachers()"></div>
      <div class="filter-pills">
        <div class="pill active" data-s="all" onclick="filterSub(this)">সব</div>
        <div class="pill" data-s="গণিত (Math)" onclick="filterSub(this)">গণিত</div>
        <div class="pill" data-s="পদার্থবিজ্ঞান (Physics)" onclick="filterSub(this)">পদার্থ</div>
        <div class="pill" data-s="রসায়ন (Chemistry)" onclick="filterSub(this)">রসায়ন</div>
        <div class="pill" data-s="ইংরেজি (English)" onclick="filterSub(this)">ইংরেজি</div>
        <div class="pill" data-s="জীববিজ্ঞান (Biology)" onclick="filterSub(this)">জীববিজ্ঞান</div>
        <div class="pill" data-s="ICT" onclick="filterSub(this)">ICT</div>
      </div>
      <div id="teacher-list"></div>
    </div>
    <div class="page" id="page-msg">
      <div class="section-title">বার্তা</div>
      <div id="chat-list"></div>
    </div>
    <div class="page" id="page-profile"></div>
  </div>

  <div class="chat-screen" id="chat-screen">
    <div class="chat-header">
      <button onclick="closeChat()">←</button>
      <div class="t-avatar" id="chat-av" style="width:36px;height:36px"></div>
      <div>
        <div style="font-size:14px;font-weight:600" id="chat-nm"></div>
        <div style="font-size:11px;color:var(--text-muted)" id="chat-sb"></div>
      </div>
    </div>
    <div class="chat-messages" id="chat-msgs"></div>
    <div class="chat-input-bar">
      <input type="text" id="chat-inp" placeholder="বার্তা লিখুন..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>

  <div class="bottom-nav" id="bnav">
    <button class="active" onclick="showPage('home',this)"><span class="nav-icon">🏠</span>হোম</button>
    <button onclick="showPage('search',this)"><span class="nav-icon">🔍</span>খুঁজুন</button>
    <button onclick="showPage('msg',this)"><span class="nav-icon">💬</span>বার্তা</button>
    <button onclick="showPage('profile',this)"><span class="nav-icon">👤</span>প্রোফাইল</button>
  </div>
</div>
<div id="toast"></div>

<script>
const SURL = 'https://gerpejpskbpwxjpfskmf.supabase.co';
const SKEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlcnBlanBza2Jwd3hqcGZza21mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODIzMzEsImV4cCI6MjA5MzA1ODMzMX0.HGXV5WxQljuh5zHYciFCBvYbvig_fylebssmROTIwTA';
const sb = supabase.createClient(SURL, SKEY);

const ADMIN_EMAIL = 'skfuad502@gmail.com';
const COLORS = [['#E6F1FB','#185FA5'],['#E1F5EE','#0F6E56'],['#FBEAF0','#993556'],['#FAEEDA','#854F0B'],['#EEEDFE','#3C3489']];

let CU = null, CUP = null, allTeachers = [], allRequests = [], subFilter = 'all', chatWith = null, msgSub = null;

function getColor(str) { let h=0; for(let c of str) h=c.charCodeAt(0)+h*31; return COLORS[Math.abs(h)%COLORS.length]; }
function initials(name) { return (name||'').split(' ').map(n=>n[0]||'').join('').toUpperCase().slice(0,2)||'?'; }
function fmtTime(ts) { const d=new Date(ts); return d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes(); }

function toast(msg, dur=2800) {
  const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', dur);
}

// ===== AUTH =====
let authTab='login', selRole_='student';

window.addEventListener('DOMContentLoaded', async ()=>{
  const {data:{session}} = await sb.auth.getSession();
  if (session) { CU=session.user; await loadProfile(); startApp(); }
  else { document.getElementById('loading-screen').style.display='none'; document.getElementById('auth-screen').style.display='flex'; }
});

function switchTab(t) {
  authTab=t;
  document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='login')||(i===1&&t==='register')));
  document.getElementById('login-form').style.display=t==='login'?'block':'none';
  document.getElementById('register-form').style.display=t==='register'?'block':'none';
  document.getElementById('auth-err').style.display='none';
}

function selRole(r) {
  selRole_=r;
  document.getElementById('role-s').classList.toggle('active',r==='student');
  document.getElementById('role-t').classList.toggle('active',r==='teacher');
  document.getElementById('t-fields').style.display=r==='teacher'?'block':'none';
  document.getElementById('s-fields').style.display=r==='student'?'block':'none';
}

function showErr(msg) { const e=document.getElementById('auth-err'); e.textContent=msg; e.style.display='block'; }

async function doLogin() {
  const email=document.getElementById('l-email').value.trim();
  const pass=document.getElementById('l-pass').value;
  if(!email||!pass){showErr('সব তথ্য পূরণ করুন!');return;}
  const btn=document.getElementById('login-btn'); btn.disabled=true; btn.textContent='অপেক্ষা করুন...';
  const {data,error} = await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false; btn.textContent='লগইন করুন';
  if(error){showErr('ইমেইল বা পাসওয়ার্ড ভুল!');return;}
  CU=data.user;
  if(email===ADMIN_EMAIL) { CUP={id:CU.id,name:'Fuad',role:'admin',avatar:'FU',color:'#E1F5EE',tc:'#0F6E56',email:ADMIN_EMAIL}; }
  else { await loadProfile(); }
  startApp();
}

async function doRegister() {
  const name=document.getElementById('r-name').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const phone=document.getElementById('r-phone').value.trim();
  const area=document.getElementById('r-area').value;
  const pass=document.getElementById('r-pass').value;
  if(!name||!email||!pass||!area){showErr('সব তথ্য পূরণ করুন!');return;}
  if(pass.length<6){showErr('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর!');return;}
  const btn=document.getElementById('reg-btn'); btn.disabled=true; btn.textContent='অপেক্ষা করুন...';
  const {data,error} = await sb.auth.signUp({email,password:pass});
  if(error){showErr('সমস্যা হয়েছে: '+error.message); btn.disabled=false; btn.textContent='অ্যাকাউন্ট তৈরি করুন'; return;}
  CU=data.user;
  const [bg,tc] = getColor(name);
  const profile = {
    id: CU.id, name, role: selRole_, phone, area,
    avatar: initials(name), color: bg, tc,
    ...(selRole_==='teacher'?{
      subject: document.getElementById('r-subject').value,
      fee: parseInt(document.getElementById('r-fee').value)||1500,
      class_range: document.getElementById('r-class').value,
      experience: '০ বছর', rating: 4.0, active: true
    }:{grade: document.getElementById('r-grade').value})
  };
  await sb.from('profiles').insert(profile);
  CUP=profile;
  btn.disabled=false; btn.textContent='অ্যাকাউন্ট তৈরি করুন';
  toast('✅ অ্যাকাউন্ট তৈরি হয়েছে!');
  startApp();
}

async function loadProfile() {
  if(!CU) return;
  if(CU.email===ADMIN_EMAIL){ CUP={id:CU.id,name:'Fuad',role:'admin',avatar:'FU',color:'#E1F5EE',tc:'#0F6E56',email:ADMIN_EMAIL}; return; }
  const {data} = await sb.from('profiles').select('*').eq('id',CU.id).single();
  CUP = data;
}

async function doLogout() {
  await sb.auth.signOut(); CU=null; CUP=null; allTeachers=[]; allRequests=[];
  if(msgSub){sb.removeChannel(msgSub);msgSub=null;}
  document.getElementById('app').style.display='none';
  document.getElementById('auth-screen').style.display='flex';
  toast('লগআউট হয়েছে');
}

// ===== APP START =====
async function startApp() {
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app').style.display='block';
  const av=document.getElementById('top-av');
  av.textContent=CUP?.avatar||'?'; av.style.background=CUP?.color||'#E1F5EE'; av.style.color=CUP?.tc||'#0F6E56';
  document.getElementById('top-name').textContent=CUP?.name||'';
  document.getElementById('top-role').textContent={student:'শিক্ষার্থী',teacher:'শিক্ষক',admin:'অ্যাডমিন'}[CUP?.role]||'';
  await loadTeachers();
  await loadRequests();
  renderHome();
  renderProfile();
  renderChatList();
}

async function loadTeachers() {
  const {data} = await sb.from('profiles').select('*').eq('role','teacher').eq('active',true);
  allTeachers = data||[];
}

async function loadRequests() {
  if(!CUP) return;
  let q = sb.from('requests').select('*');
  if(CUP.role==='student') q=q.eq('student_id',CUP.id);
  else if(CUP.role==='teacher') q=q.eq('teacher_id',CUP.id);
  const {data} = await q;
  allRequests = data||[];
}

// ===== PAGES =====
function showPage(name,btn) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('#bnav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(name==='search') renderTeachers();
  if(name==='msg') renderChatList();
  if(name==='home') renderHome();
}

// ===== HOME =====
function renderHome() {
  const el=document.getElementById('page-home');
  if(!CUP){el.innerHTML='';return;}
  if(CUP.role==='student') renderStudentHome(el);
  else if(CUP.role==='teacher') renderTeacherHome(el);
  else renderAdminHome(el);
}

// ===== TEACHERS =====
function renderTeachers() {
  const el=document.getElementById('teacher-list'); if(!el) return;
  const q=(document.getElementById('search-inp')||{value:''}).value.toLowerCase();
  const list=allTeachers.filter(t=>{
    if(subFilter!=='all'&&t.subject!==subFilter) return false;
    if(q&&!t.name.toLowerCase().includes(q)&&!(t.subject||'').toLowerCase().includes(q)) return false;
    return true;
  });
  if(list.length===0){el.innerHTML=`<div class="empty-state"><div class="icon">😔</div><p>কোনো শিক্ষক পাওয়া যায়নি</p></div>`;return;}
  el.innerHTML=list.map(t=>{
    const isMy=allRequests.some(r=>r.student_id===CUP?.id&&r.teacher_id===t.id);
    return `<div class="teacher-card">
      <div class="tc-header">
        <div class="tc-avatar" style="background:${t.color};color:${t.tc}">${t.avatar}</div>
        <div style="flex:1">
          <div class="tc-name">${t.name}</div>
          <div class="tc-sub">${t.subject||''} · ${t.area||''}</div>
          <div style="font-size:12px;color:var(--warn)">★ ${t.rating||4.5}</div>
        </div>
      </div>
      <div class="tc-info">
        <div class="tc-info-item"><div class="lbl">শ্রেণি</div><div class="val">${t.class_range||''}</div></div>
        <div class="tc-info-item"><div class="lbl">অভিজ্ঞতা</div><div class="val">${t.experience||'—'}</div></div>
        <div class="tc-info-item"><div class="lbl">মাসিক ফি</div><div class="val" style="color:var(--green)">৳${(t.fee||0).toLocaleString()}</div></div>
      </div>
      <div class="btn-row">
        <button class="btn-sm btn-outline" style="flex:1" onclick="openChat('${t.id}','${t.name}','${t.subject||''}','${t.color}','${t.tc}','${t.avatar}')">💬 বার্তা</button>
        ${CUP?.role==='student'?`<button class="btn-sm btn-green" style="flex:1" ${isMy?'disabled':''}  onclick="reqTeacher('${t.id}','${t.fee||0}')">${isMy?'✅ যুক্ত আছেন':'+ অনুরোধ করুন'}</button>`:''}
      </div>
    </div>`;
  }).join('');
}

function filterSub(el) {
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active'); subFilter=el.dataset.s; renderTeachers();
}

async function reqTeacher(tid, fee) {
  if(CUP?.role!=='student'){toast('শুধু শিক্ষার্থীরা পারবে');return;}
  const sf=Math.round(parseInt(fee)*0.10);
  const {error}=await sb.from('requests').insert({student_id:CUP.id,teacher_id:tid,status:'pending',service_fee:sf});
  if(error){toast('❌ সমস্যা হয়েছে');return;}
  await loadRequests(); renderTeachers(); renderHome();
  toast(`✅ অনুরোধ পাঠানো হয়েছে! সার্ভিস ফি: ৳${sf} (১০%)`);
}

async function acceptReq(rid) {
  await sb.from('requests').update({status:'active'}).eq('id',rid);
  await loadRequests(); renderHome(); toast('✅ গ্রহণ হয়েছে!');
}

// ===== MESSAGES =====
async function renderChatList() {
  const el=document.getElementById('chat-list'); if(!el) return;
  const {data:sent} = await sb.from('messages').select('to_id').eq('from_id',CUP.id);
  const {data:recv} = await sb.from('messages').select('from_id').eq('to_id',CUP.id);
  const ids=[...new Set([...(sent||[]).map(x=>x.to_id),...(recv||[]).map(x=>x.from_id)])];
  if(ids.length===0){el.innerHTML=`<div class="empty-state"><div class="icon">💬</div><p>এখনো কোনো বার্তা নেই।</p></div>`;return;}
  const {data:users}=await sb.from('profiles').select('*').in('id',ids);
  el.innerHTML=(users||[]).map(u=>`
    <div class="chat-list-item" onclick="openChat('${u.id}','${u.name}','${u.subject||u.grade||''}','${u.color}','${u.tc}','${u.avatar}')">
      <div class="tc-avatar" style="width:46px;height:46px;font-size:17px;border-radius:13px;background:${u.color};color:${u.tc}">${u.avatar}</div>
      <div style="flex:1"><div style="font-size:14px;font-weight:600">${u.name}</div><div class="msg-preview">${u.subject||u.grade||''}</div></div>
    </div>`).join('');
}

async function openChat(uid,name,sub,color,tc,avatar) {
  chatWith=uid;
  const av=document.getElementById('chat-av');
  av.textContent=avatar; av.style.background=color; av.style.color=tc;
  document.getElementById('chat-nm').textContent=name;
  document.getElementById('chat-sb').textContent=sub;
  await loadMessages();
  if(msgSub) sb.removeChannel(msgSub);
  msgSub = sb.channel('msgs-'+[CUP.id,uid].sort().join('-'))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>loadMessages())
    .subscribe();
  document.getElementById('chat-screen').classList.add('open');
  document.getElementById('bnav').style.display='none';
  document.getElementById('main-content').style.display='none';
}

function closeChat() {
  document.getElementById('chat-screen').classList.remove('open');
  document.getElementById('bnav').style.display='flex';
  document.getElementById('main-content').style.display='block';
  if(msgSub){sb.removeChannel(msgSub);msgSub=null;}
  chatWith=null; renderChatList();
}

async function loadMessages() {
  if(!chatWith) return;
  const {data}=await sb.from('messages').select('*')
    .or(`and(from_id.eq.${CUP.id},to_id.eq.${chatWith}),and(from_id.eq.${chatWith},to_id.eq.${CUP.id})`)
    .order('created_at');
  const el=document.getElementById('chat-msgs');
  el.innerHTML=(data||[]).map(m=>{
    const isMe=m.from_id===CUP.id;
    return `<div><div class="bubble ${isMe?'me':'them'}">${m.text}</div><div class="btime ${isMe?'r':''}">${fmtTime(m.created_at)}</div></div>`;
  }).join('');
  el.scrollTop=el.scrollHeight;
}

async function sendMsg() {
  const inp=document.getElementById('chat-inp');
  const text=inp.value.trim();
  if(!text||!chatWith) return;
  inp.value='';
  await sb.from('messages').insert({from_id:CUP.id,to_id:chatWith,text});
  await loadMessages();
}

      <div class="info-row"><span class="key" style="color:#166534">মাসিক ফি</span><span class="val">৳${(CUP.fee||0).toLocaleString()}</span></div>
      <div class="info-row"><span class="key" style="color:#166534">কমিশন (২০%)</span><span class="val" style="color:var(--danger)">-৳${Math.round((CUP.fee||0)*0.2).toLocaleString()}</span></div>
      <div class="info-row"><span class="key" style="color:#166534">নেট আয়</span><span class="val" style="color:var(--green)">৳${Math.round((CUP.fee||0)*0.8).toLocaleString()}</span></div>
    </div>`:''}
    <button class="btn-primary" style="background:var(--danger);margin-top:8px" onclick="doLogout()">লগআউট করুন</button>`;
}
</script>
</body>
</html>
